# Server
server.port=8080

# Scanner
# Default token "naps2" is resolved to NAPS2.Console.exe under Program Files or %LOCALAPPDATA%\Programs\NAPS2 on Windows.
# Override with SCANNER_COMMAND or --scanner.command=... if NAPS2 is installed elsewhere.
# NAPS2 8.x / 7.3+: JSON field "scannerDevice" = partial device match with --noprofile.
# scanner.driver=auto: GET /devices merges --listdevices for each id in scanner.auto-drivers; entries look like twain||Device name.
#   Pass that full string (or a partial name matching one listed device) as scannerDevice for POST /scan.
# scanner.driver=twain|wia|escl|...: fixed driver; GET /devices returns plain names (no prefix).
# Optional JSON "profile" = GUI profile name (-p); if set, it overrides device-based scanning for that request.
# NAPS2 7.1.x: use "scannerDevice" or default-device as the GUI profile name; no --listdevices.
scanner.command=naps2
scanner.driver=auto
scanner.auto-drivers=twain,wia,escl
# Cache GET /devices + auto driver matching (seconds). 0 = always run NAPS2 again (slower on refresh).
scanner.device-list-cache-seconds=15
# Writable on Windows regardless of process working directory (avoid ./scans under System32 etc.)
scanner.output.dir=${user.home}/ScannerService/scans

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.scannerservice=DEBUG

